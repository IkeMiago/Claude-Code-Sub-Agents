<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>TODO</h1>
      </header>

      <form class="todo-form" id="todo-form" autocomplete="off">
        <input
          type="text"
          id="new-todo"
          name="new-todo"
          placeholder="What needs to be done?"
          aria-label="New todo"
        />
        <button type="submit" class="add-btn">追加</button>
      </form>

      <section class="todo-list-section" id="todo-list-section" hidden>
        <ul id="todo-list"></ul>
      </section>

      <footer class="todo-footer" id="todo-footer" hidden>
        <span class="item-count" id="item-count">0 items left</span>
        <div class="filter-buttons" id="filter-buttons">
          <button type="button" data-filter="all" class="active">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </div>
        <button type="button" class="clear-completed" id="clear-completed" hidden>
          Clear completed
        </button>
      </footer>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
